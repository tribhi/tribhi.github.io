<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d52"/>
      <stop offset="1" stop-color="#1e5aa8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- globe -->
  <g transform="translate(200 132)" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5">
    <circle r="92"/>
    <ellipse rx="46" ry="92"/>
    <ellipse rx="80" ry="92"/>
    <line x1="0" y1="-92" x2="0" y2="92"/>
    <ellipse rx="92" ry="30"/>
    <line x1="-92" y1="0" x2="92" y2="0"/>
  </g>

  <!-- mentor-student links -->
  <g stroke="#ffcb05" stroke-width="2" stroke-opacity=".85" fill="none">
    <path d="M128 92 Q170 60 222 84"/>
    <path d="M128 92 Q150 140 196 164"/>
    <path d="M272 112 Q250 150 196 164"/>
    <path d="M272 112 Q300 170 258 200"/>
    <path d="M222 84 Q260 80 272 112"/>
    <path d="M150 196 Q170 190 196 164"/>
  </g>

  <!-- mentors (blue) and students (saffron) -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="128" cy="92" r="11" fill="#8fc1ff"/>
    <circle cx="272" cy="112" r="11" fill="#8fc1ff"/>
    <circle cx="222" cy="84" r="8" fill="#ff9933"/>
    <circle cx="196" cy="164" r="8" fill="#ff9933"/>
    <circle cx="258" cy="200" r="8" fill="#ff9933"/>
    <circle cx="150" cy="196" r="8" fill="#ff9933"/>
  </g>

  <!-- matrix bracket motif -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M42 42 h-10 v40 h10"/>
    <path d="M78 42 h10 v40 h-10"/>
  </g>
  <g fill="#ffffff" fill-opacity=".85" font-size="12" font-weight="700" text-anchor="middle">
    <text x="60" y="58">A x</text>
    <text x="60" y="76">= b</text>
  </g>

  <text x="200" y="262" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">AI Research Mentoring</text>
  <text x="200" y="284" fill="#ffffff" fill-opacity=".75" font-size="11" text-anchor="middle" letter-spacing="1.5">MATH FOR AI  ·  REMOTE RESEARCH  ·  GRAD MENTORS</text>
</svg>
