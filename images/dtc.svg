<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="400" height="300" fill="#f3f5f8"/>

  <!-- connection -->
  <path d="M110 150 C160 70 240 70 290 150" fill="none" stroke="#1e5aa8" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M110 150 C160 230 240 230 290 150" fill="none" stroke="#a6192e" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- lecture / video badge on top arc -->
  <g transform="translate(200 90)">
    <rect x="-34" y="-20" width="68" height="40" rx="7" fill="#ffffff" stroke="#1e5aa8" stroke-width="2"/>
    <path d="M-7 -10 L11 0 L-7 10 Z" fill="#1e5aa8"/>
  </g>
  <!-- discussion badge on bottom arc -->
  <g transform="translate(200 210)">
    <rect x="-34" y="-20" width="68" height="40" rx="7" fill="#ffffff" stroke="#a6192e" stroke-width="2"/>
    <circle cx="-12" cy="0" r="4" fill="#a6192e"/>
    <circle cx="0" cy="0" r="4" fill="#a6192e"/>
    <circle cx="12" cy="0" r="4" fill="#a6192e"/>
  </g>

  <!-- nodes -->
  <circle cx="90" cy="150" r="46" fill="#00274c"/>
  <text x="90" y="146" fill="#ffcb05" font-size="13" font-weight="700" text-anchor="middle">UMich</text>
  <text x="90" y="164" fill="#ffffff" font-size="10" text-anchor="middle">ROB 101</text>

  <circle cx="310" cy="150" r="46" fill="#003a63"/>
  <text x="310" y="146" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Howard</text>
  <text x="310" y="164" fill="#ffffff" fill-opacity=".8" font-size="10" text-anchor="middle">CS majors</text>

  <text x="200" y="38" fill="#2b2f36" font-size="15" font-weight="700" text-anchor="middle">Distributed Teaching Collaborative</text>
  <text x="200" y="272" fill="#6b7280" font-size="11" text-anchor="middle">Recorded lectures  ·  Flipped classroom</text>
</svg>
